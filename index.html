const form = document.getElementById("testForm");

questions.forEach((question, index) => {

  const [type, text] = question;
  const number = index + 1;

  const div = document.createElement("div");
  div.className = "question";

  div.innerHTML = `
    <div class="question-number">
      문항 ${number} · ${intelligence[type]}
    </div>

    <div class="question-text">
      ${text}
    </div>

    <div class="scores">
      ${[1,2,3,4,5].map(score => `
        <div class="score-option">
          <input
            type="radio"
            id="q${number}_${score}"
            name="q${number}"
            value="${score}"
            onchange="updateProgress()"
          >
          <label for="q${number}_${score}">
            ${score}
          </label>
        </div>
      `).join("")}
    </div>

    <div class="scale">
      <span>전혀 그렇지 않다</span>
      <span>매우 그렇다</span>
    </div>
  `;

  form.appendChild(div);
});


function updateProgress() {

  let completed = 0;

  questions.forEach((_, index) => {
    const selected =
      document.querySelector(`input[name="q${index + 1}"]:checked`);

    if (selected) completed++;
  });

  const percent = (completed / questions.length) * 100;

  document.getElementById("progressText").textContent =
    `${completed} / ${questions.length}`;

  document.getElementById("progressBar").style.width =
    `${percent}%`;
}


function showResult() {

  const scores = {};

  for (let i = 1; i <= 9; i++) {
    scores[i] = [];
  }

  let unanswered = [];

  questions.forEach((question, index) => {

    const questionNumber = index + 1;
    const type = question[0];

    const selected =
      document.querySelector(
        `input[name="q${questionNumber}"]:checked`
      );

    if (!selected) {
      unanswered.push(questionNumber);
    } else {
      scores[type].push(Number(selected.value));
    }
  });

  if (unanswered.length > 0) {

    alert(
      `아직 답하지 않은 문항이 ${unanswered.length}개 있습니다.\n\n` +
      `문항 번호: ${unanswered.join(", ")}`
    );

    document.querySelector(
      `input[name="q${unanswered[0]}"]`
    ).closest(".question").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

    return;
  }


  const results = [];

  for (let i = 1; i <= 9; i++) {

    const total =
      scores[i].reduce((sum, value) => sum + value, 0);

    const average =
      total / scores[i].length;

    results.push({
      type: i,
      name: intelligence[i],
      total: total,
      average: average
    });
  }


  results.sort((a, b) => b.average - a.average);


  const resultContent =
    document.getElementById("resultContent");

  resultContent.innerHTML = results.map((item, index) => {

    const percentage = (item.average / 5) * 100;

    return `
      <div class="result-item">

        <div class="result-header">
          <span>
            ${index + 1}. ${item.name}
          </span>

          <span>
            ${item.average.toFixed(2)} / 5
          </span>
        </div>

        <div class="result-bar">
          <div
            class="result-fill"
            style="width:${percentage}%"
          ></div>
        </div>

      </div>
    `;

  }).join("");


  const result = document.getElementById("result");

  result.style.display = "block";

  result.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

</script>
